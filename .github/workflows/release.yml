# Publishes pack.json as a GitHub release when Kade pushes a tag `pack-<N>` (pack-1, pack-2,
# ...). The tag must be on main. The pack is verified with content-pack built from the core tag
# in core-version, then released with two assets under fixed names, `pack.json` and
# `pack.json.sha256`: the app fetches
# https://github.com/stella-rain/content/releases/latest/download/pack.json.
# Protect the `pack-*` tags with a ruleset so only Kade can push one.
name: Release

on:
  push:
    tags: ["pack-*"]

permissions: {}

jobs:
  release:
    name: verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::tag $TAG is not on main"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache content-pack
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/content-pack
          key: content-pack-${{ runner.os }}-${{ hashFiles('core-version') }}

      - name: Install content-pack at the pinned core tag
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/stella-rain/core --tag "$(cat core-version)" \
            --bin content-pack --locked stella-rain-core

      - name: Verify pack.json
        id: verify
        run: |
          set -euo pipefail
          out=$(content-pack verify pack.json)
          echo "$out"
          verified=$(printf '%s\n' "$out" | sed -n 's/^sha256: //p')
          sim_version=$(printf '%s\n' "$out" | sed -n 's/^sim_version: //p')
          computed=$(sha256sum pack.json | cut -d' ' -f1)
          if [ -z "$verified" ] || [ "$verified" != "$computed" ]; then
            echo "::error::content-pack sha256 '$verified' differs from sha256sum '$computed'"
            exit 1
          fi
          echo "sha256=$computed" >> "$GITHUB_OUTPUT"
          echo "sim_version=$sim_version" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          SHA256: ${{ steps.verify.outputs.sha256 }}
          SIM_VERSION: ${{ steps.verify.outputs.sim_version }}
        run: |
          set -euo pipefail
          printf '%s  pack.json\n' "$SHA256" > pack.json.sha256
          printf 'Content pack for sim_version %s.\n\nSHA-256: %s\nValidated with core %s\n' \
            "$SIM_VERSION" "$SHA256" "$(cat core-version)" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" pack.json pack.json.sha256 \
            --verify-tag --latest --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
