# Candidate (release-flow, step 3). An agent pushes candidate/<12-character sha> at a commit on
# main, adding no commit; Kade runs this workflow on that branch. It
#   - refuses unless the branch names HEAD, HEAD is on main, no other candidate branch is left over,
#     the branch has not moved, every check run on HEAD passed and VERSION is new, with a CHANGELOG
#     entry (scripts/release.cjs),
#   - verifies pack.json with content-pack built from the core tag in core-version, and writes
#     pack.json.sha256, packs.json (the latest release's channels with this core minor's set to
#     v<VERSION>, scripts/release.cjs packs) and SHA256SUMS,
#   - tags HEAD v<VERSION>-rc.N and makes a GitHub prerelease with the assets. GitHub's "latest"
#     skips prereleases, so no player gets it,
#   - makes the branch rc/<rc tag> at that commit, for Promote (promote.yml) to run from, and
#     deletes the same version's lower rc branches.
# A successful run deletes the candidate/<sha> branch; a failed or refused one keeps it, so Candidate
# can run again on it. auto-candidate deletes it when main gets a newer candidate, or Kade does.
# Only the tag and cleanup jobs can write, and they run none of the repository's code.
name: Candidate

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: verify and sums
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read  # the check runs on HEAD
    outputs:
      version: ${{ steps.plan.outputs.version }}
      rc: ${{ steps.plan.outputs.rc }}
      superseded: ${{ steps.plan.outputs.superseded }}
    steps:
      - name: Only a candidate branch is a candidate
        run: |
          case "$GITHUB_REF" in
            refs/heads/candidate/*) ;;
            *) echo "::error::a candidate is made from a candidate/* branch only; this run is on $GITHUB_REF"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The branch names a commit on main, has not moved, and its checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/release.cjs check-candidate "$GITHUB_REF_NAME"
          head=$(gh api "repos/$REPO/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME moved from $GITHUB_SHA to $head"
            exit 1
          fi
          gh api "repos/$REPO/commits/$GITHUB_SHA/check-runs?per_page=100" \
            | node scripts/release.cjs checks-passed "$GITHUB_RUN_ID"

      - name: The version is new and has notes
        id: plan
        run: |
          set -euo pipefail
          node scripts/release.cjs check-version
          version=$(node scripts/release.cjs version)
          rc=$(node scripts/release.cjs rc)
          node scripts/release.cjs notes > /dev/null
          {
            echo "version=$version"
            echo "rc=$rc"
            echo "superseded=$(node scripts/release.cjs superseded "$rc")"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache content-pack
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/content-pack
          key: content-pack-${{ runner.os }}-${{ hashFiles('core-version') }}

      - name: Install content-pack at the pinned core tag
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/stella-rain/core --tag "$(cat core-version)" \
            --bin content-pack --locked stella-rain-core

      - name: Verify pack.json and write the assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.plan.outputs.version }}
          RC: ${{ steps.plan.outputs.rc }}
        run: |
          set -euo pipefail
          out=$(content-pack verify pack.json)
          echo "$out"
          verified=$(printf '%s\n' "$out" | sed -n 's/^sha256: //p')
          sim_version=$(printf '%s\n' "$out" | sed -n 's/^sim_version: //p')
          computed=$(sha256sum pack.json | cut -d' ' -f1)
          if [ -z "$verified" ] || [ "$verified" != "$computed" ]; then
            echo "::error::content-pack sha256 '$verified' differs from sha256sum '$computed'"
            exit 1
          fi
          assets="$RUNNER_TEMP/assets"
          mkdir "$assets"
          cp pack.json "$assets/pack.json"
          cd "$assets"
          printf '%s  pack.json\n' "$computed" > pack.json.sha256
          latest=$(cd "$GITHUB_WORKSPACE" && node scripts/release.cjs latest)
          prev=-
          if [ -n "$latest" ]; then
            names=$(gh release view "$latest" --repo "$REPO" --json assets --jq '.assets[].name')
            if printf '%s\n' "$names" | grep -qx packs.json; then
              gh release download "$latest" --repo "$REPO" --pattern packs.json --output "$RUNNER_TEMP/previous-packs.json"
              prev="$RUNNER_TEMP/previous-packs.json"
            fi
          fi
          (cd "$GITHUB_WORKSPACE" && node scripts/release.cjs packs "$prev") > packs.json
          cat packs.json >> "$GITHUB_STEP_SUMMARY"
          sha256sum pack.json pack.json.sha256 packs.json > SHA256SUMS
          sha256sum -c SHA256SUMS
          previous=$(cd "$GITHUB_WORKSPACE" && node scripts/release.cjs latest)
          {
            echo "Content pack $VERSION, candidate $RC, from main at $GITHUB_SHA."
            echo
            (cd "$GITHUB_WORKSPACE" && node scripts/release.cjs notes)
            echo
            echo "sim_version: ${sim_version:-unknown}"
            echo "SHA-256: $computed"
            echo "Validated with core $(cat "$GITHUB_WORKSPACE/core-version")"
            if [ -n "$previous" ]; then
              echo
              echo "Since $previous:"
              echo
              git -C "$GITHUB_WORKSPACE" log --no-merges --format='- %h %s' "$previous..HEAD"
            fi
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ${{ runner.temp }}/assets/pack.json
            ${{ runner.temp }}/assets/pack.json.sha256
            ${{ runner.temp }}/assets/packs.json
            ${{ runner.temp }}/assets/SHA256SUMS
            ${{ runner.temp }}/assets/notes.md
          if-no-files-found: error
          retention-days: 1

  tag:
    name: rc tag and prerelease
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # the rc tag, the prerelease and the rc branches
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Tag the commit, make the prerelease and the rc/ branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RC: ${{ needs.check.outputs.rc }}
          SUPERSEDED: ${{ needs.check.outputs.superseded }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME moved from $GITHUB_SHA to $head"
            exit 1
          fi
          (cd assets && sha256sum -c SHA256SUMS)
          object=$(jq -n --arg tag "$RC" --arg sha "$GITHUB_SHA" \
                     '{tag: $tag, message: ("Content pack " + $tag), object: $sha, type: "commit"}' \
                   | gh api "repos/$REPO/git/tags" --input - --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$RC" -f sha="$object" > /dev/null
          gh release create "$RC" assets/pack.json assets/pack.json.sha256 assets/packs.json assets/SHA256SUMS \
            --repo "$REPO" --verify-tag --prerelease --title "$RC" --notes-file assets/notes.md
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/rc/$RC" -f sha="$GITHUB_SHA" > /dev/null
          for b in $SUPERSEDED; do
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b" > /dev/null || echo "::warning::could not delete $b"
          done
          {
            echo "Candidate $RC at $GITHUB_SHA on main."
            if [ -n "$SUPERSEDED" ]; then echo "Deleted the superseded $SUPERSEDED."; fi
            echo "Try it: download pack.json from the prerelease and run content-pack verify on it,"
            echo "then Actions > Promote > Run workflow > branch rc/$RC."
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: delete the candidate branch
    needs: [check, tag]
    if: needs.tag.result == 'success' && startsWith(github.ref, 'refs/heads/candidate/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # deleting the branch
    steps:
      - name: Delete the branch of a candidate that was made
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api -X DELETE "repos/$REPO/git/refs/heads/$GITHUB_REF_NAME" > /dev/null; then
            echo "Deleted $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$(gh api "repos/$REPO/git/matching-refs/heads/$GITHUB_REF_NAME" \
                      --jq 'map(select(.ref == "refs/heads/" + env.GITHUB_REF_NAME)) | length')" = 0 ]; then
            echo "$GITHUB_REF_NAME was already deleted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::could not delete $GITHUB_REF_NAME; Kade deletes it"
            exit 1
          fi
