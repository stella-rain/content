# Candidate (release-flow, step 3). Kade runs this workflow on main itself; there is no candidate
# branch. VERSION is a floor: the release is VERSION when it is above the latest release, else that
# release's next patch (scripts/release.cjs final). It
#   - refuses unless this run is on main, main has not moved, there is a commit since the latest
#     release, this commit is not a candidate already, every check run on it passed, core-version is a
#     core tag and CHANGELOG.md has the entry for the release (scripts/release.cjs),
#   - when the release is not VERSION, stamps it into VERSION in the checked-out tree,
#   - verifies pack.json with content-pack built from the core tag in core-version, and writes
#     pack.json.sha256, packs.json (the latest release's channels with this core minor's set to
#     v<release>, scripts/release.cjs packs) and SHA256SUMS, all from that stamped tree,
#   - tags the main commit v<release>-rc.N, or, when VERSION was stamped, a "Release v<release>"
#     commit made through the API on top of it, only if its tree equals the tested tree; makes a
#     GitHub prerelease with the assets (GitHub's "latest" skips prereleases, so no player gets it),
#   - makes the branch rc/<rc tag> at the tagged commit, for Promote (promote.yml) to run from, and
#     deletes the same version's lower rc branches.
# Nothing is written to main. Only the tag job can write, and it runs none of the repository's code.
name: Candidate

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: verify and sums
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read  # the check runs on main's commit
    outputs:
      version: ${{ steps.plan.outputs.version }}
      rc: ${{ steps.plan.outputs.rc }}
      superseded: ${{ steps.plan.outputs.superseded }}
      stamped: ${{ steps.stamp.outputs.stamped }}
      tree: ${{ steps.stamp.outputs.tree }}
    steps:
      - name: Only main is a candidate
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            *) echo "::error::a candidate is made on main only; this run is on $GITHUB_REF"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Main has not moved, has something to release, is no candidate yet, and its checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/release.cjs check-main
          head=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main moved from $GITHUB_SHA to $head"
            exit 1
          fi
          node scripts/release.cjs check-candidate
          gh api "repos/$REPO/commits/$GITHUB_SHA/check-runs?per_page=100" \
            | node scripts/release.cjs checks-passed "$GITHUB_RUN_ID"

      - name: The release is new and has notes
        id: plan
        run: |
          set -euo pipefail
          node scripts/release.cjs check-version
          version=$(node scripts/release.cjs final)
          rc=$(node scripts/release.cjs rc)
          node scripts/release.cjs notes > /dev/null
          {
            echo "version=$version"
            echo "rc=$rc"
            echo "superseded=$(node scripts/release.cjs superseded "$rc")"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp the release into the tree when VERSION is not it
        id: stamp
        env:
          FINAL: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          stamped=false
          if [ "$(node scripts/release.cjs version)" != "$FINAL" ]; then
            stamped=true
            node scripts/release.cjs stamp
            changed=$(git diff --name-only)
            if [ "$changed" != "VERSION" ]; then
              echo "::error::stamping changed '$changed', not VERSION only"
              exit 1
            fi
            git add VERSION
          fi
          tree=$(git write-tree)
          echo "stamped=$stamped" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "Tested tree $tree (VERSION stamped: $stamped)." >> "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache content-pack
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/content-pack
          key: content-pack-${{ runner.os }}-${{ hashFiles('core-version') }}

      - name: Install content-pack at the pinned core tag
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/stella-rain/core --tag "$(cat core-version)" \
            --bin content-pack --locked stella-rain-core

      - name: Verify pack.json and write the assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.plan.outputs.version }}
          RC: ${{ steps.plan.outputs.rc }}
        run: |
          set -euo pipefail
          out=$(content-pack verify pack.json)
          echo "$out"
          verified=$(printf '%s\n' "$out" | sed -n 's/^sha256: //p')
          sim_version=$(printf '%s\n' "$out" | sed -n 's/^sim_version: //p')
          computed=$(sha256sum pack.json | cut -d' ' -f1)
          if [ -z "$verified" ] || [ "$verified" != "$computed" ]; then
            echo "::error::content-pack sha256 '$verified' differs from sha256sum '$computed'"
            exit 1
          fi
          assets="$RUNNER_TEMP/assets"
          mkdir "$assets"
          cp pack.json "$assets/pack.json"
          cd "$assets"
          printf '%s  pack.json\n' "$computed" > pack.json.sha256
          latest=$(cd "$GITHUB_WORKSPACE" && node scripts/release.cjs latest)
          prev=-
          if [ -n "$latest" ]; then
            names=$(gh release view "$latest" --repo "$REPO" --json assets --jq '.assets[].name')
            if printf '%s\n' "$names" | grep -qx packs.json; then
              gh release download "$latest" --repo "$REPO" --pattern packs.json --output "$RUNNER_TEMP/previous-packs.json"
              prev="$RUNNER_TEMP/previous-packs.json"
            fi
          fi
          (cd "$GITHUB_WORKSPACE" && node scripts/release.cjs packs "$prev") > packs.json
          cat packs.json >> "$GITHUB_STEP_SUMMARY"
          sha256sum pack.json pack.json.sha256 packs.json > SHA256SUMS
          sha256sum -c SHA256SUMS
          previous=$(cd "$GITHUB_WORKSPACE" && node scripts/release.cjs latest)
          {
            echo "Content pack $VERSION, candidate $RC, from main at $GITHUB_SHA."
            echo
            (cd "$GITHUB_WORKSPACE" && node scripts/release.cjs notes)
            echo
            echo "sim_version: ${sim_version:-unknown}"
            echo "SHA-256: $computed"
            echo "Validated with core $(cat "$GITHUB_WORKSPACE/core-version")"
            if [ -n "$previous" ]; then
              echo
              echo "Since $previous:"
              echo
              git -C "$GITHUB_WORKSPACE" log --no-merges --format='- %h %s' "$previous..HEAD"
            fi
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ${{ runner.temp }}/assets/pack.json
            ${{ runner.temp }}/assets/pack.json.sha256
            ${{ runner.temp }}/assets/packs.json
            ${{ runner.temp }}/assets/SHA256SUMS
            ${{ runner.temp }}/assets/notes.md
          if-no-files-found: error
          retention-days: 1

  tag:
    name: rc tag and prerelease
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # the release commit, the rc tag, the prerelease and the rc branches
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Tag the commit, make the prerelease and the rc/ branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FINAL: ${{ needs.check.outputs.version }}
          RC: ${{ needs.check.outputs.rc }}
          SUPERSEDED: ${{ needs.check.outputs.superseded }}
          STAMPED: ${{ needs.check.outputs.stamped }}
          TREE: ${{ needs.check.outputs.tree }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main moved from $GITHUB_SHA to $head"
            exit 1
          fi
          (cd assets && sha256sum -c SHA256SUMS)
          target=$GITHUB_SHA
          if [ "$STAMPED" = true ]; then
            # The release commit: main's tree with VERSION replaced, parent the main commit. It is
            # made only if its tree is the tree the checks ran on.
            base=$(gh api "repos/$REPO/git/commits/$GITHUB_SHA" --jq .tree.sha)
            blob=$(jq -n --arg c "$FINAL"$'\n' '{content: $c, encoding: "utf-8"}' \
                   | gh api "repos/$REPO/git/blobs" --input - --jq .sha)
            tree=$(jq -n --arg base "$base" --arg blob "$blob" \
                     '{base_tree: $base, tree: [{path: "VERSION", mode: "100644", type: "blob", sha: $blob}]}' \
                   | gh api "repos/$REPO/git/trees" --input - --jq .sha)
            if [ "$tree" != "$TREE" ]; then
              echo "::error::the release tree $tree is not the tested tree $TREE; no release commit made"
              exit 1
            fi
            target=$(jq -n --arg msg "Release v$FINAL" --arg tree "$tree" --arg parent "$GITHUB_SHA" \
                       '{message: $msg, tree: $tree, parents: [$parent]}' \
                     | gh api "repos/$REPO/git/commits" --input - --jq .sha)
          fi
          object=$(jq -n --arg tag "$RC" --arg sha "$target" \
                     '{tag: $tag, message: ("Content pack " + $tag), object: $sha, type: "commit"}' \
                   | gh api "repos/$REPO/git/tags" --input - --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$RC" -f sha="$object" > /dev/null
          gh release create "$RC" assets/pack.json assets/pack.json.sha256 assets/packs.json assets/SHA256SUMS \
            --repo "$REPO" --verify-tag --prerelease --title "$RC" --notes-file assets/notes.md
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/rc/$RC" -f sha="$target" > /dev/null
          for b in $SUPERSEDED; do
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b" > /dev/null || echo "::warning::could not delete $b"
          done
          {
            echo "Candidate $RC at $target, on main's $GITHUB_SHA."
            if [ "$STAMPED" = true ]; then echo "A release commit (VERSION $FINAL) on top of it; main is unchanged."; fi
            if [ -n "$SUPERSEDED" ]; then echo "Deleted the superseded $SUPERSEDED."; fi
            echo "Try it: download pack.json from the prerelease and run content-pack verify on it,"
            echo "then Actions > Promote > Run workflow > branch rc/$RC."
          } >> "$GITHUB_STEP_SUMMARY"
