# Candidate guard (release-flow). An rc/* branch is made only by Candidate, with GITHUB_TOKEN, which
# starts no workflow: any push to one is someone else's, so it is deleted and this run fails
# (Promote checks the head against the tag anyway). A deletion is ignored, and the workflows' own
# deletions start no workflow either. There is no candidate branch: Candidate runs on main. It
# checks nothing out, so it runs none of the repository's code. It guards against mistakes: a push
# that changes this file runs the changed file.
name: Candidate guard

on:
  push:
    branches: ["rc/**"]

permissions: {}

jobs:
  guard:
    name: candidate branch unchanged
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # deleting a branch that broke the rule
    steps:
      - name: Delete an rc branch that was pushed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "::error::$GITHUB_REF_NAME is made only by the Candidate workflow, never pushed; it is deleted"
          gh api -X DELETE "repos/$REPO/git/refs/heads/$GITHUB_REF_NAME" > /dev/null || true
          exit 1
